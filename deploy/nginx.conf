# The site is static: scripts, styles and fonts named after their contents, two pages, and the data.
#
# A file whose name changes with its contents is kept for a year by browsers and CDNs alike. A file
# with a fixed name is checked on every use, and an unchanged one costs a 304. So a new release reaches
# the next request without a purge. deploy/check-image.sh holds every rule below.

map $uri $cache_for_path {
    "/"                     "no-cache";
    "/tiles/catalog.json"   "no-cache";
    "/healthz"              "no-store";
    ~^/assets/              "public, max-age=31536000, immutable";
    ~^/tiles/[^/]+\.bin$    "public, max-age=31536000, immutable";
    ~\.html$                "no-cache";
    default                 "public, max-age=3600";
}

# An error is never kept, so that no cache holds on to a file that is missing only for a moment.
map $status $cache_control {
    ~^[45]    "no-store";
    default   $cache_for_path;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # TLS ends in front of this container, so a redirect must not name this port or scheme.
    absolute_redirect off;

    # The build leaves a gzip copy of every file that compresses well.
    gzip_static on;
    gzip_vary on;
    etag on;
    charset utf-8;
    charset_types text/css text/plain text/javascript application/javascript application/json;

    add_header Cache-Control $cache_control always;
    # Scripts, styles, fonts and data all come from this origin. The smaller font arrives inside the
    # stylesheet, as a data: URL.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The page needs HTTPS to check its data, so it is never served without it. No subdomains: they are
    # not this site's to decide for.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        try_files /index.html =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A folder has no listing.
    location ~ /$ {
        return 404;
    }

    location / {
        try_files $uri =404;
    }
}
