name: CI
on:
  push:
    branches: [main]
  pull_request:

# A fork's pull request runs this too, so it gets nothing beyond reading the code.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # The skills are for agents, and some are private. No gate reads them.
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @solar/web exec playwright install --with-deps chromium
      - run: pnpm verify

  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: ~/.cache/solar-system/kernels
          key: kernels-${{ hashFiles('data/kernels.lock.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:kernel

  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: ~/.cache/solar-system/kernels
          key: kernels-${{ hashFiles('data/kernels.lock.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm obs:check
