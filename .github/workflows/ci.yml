name: CI
on:
  push:
    branches: [main]
  pull_request:

# A fork's pull request runs this too, so it gets nothing beyond reading the code.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # The skills are for agents, and some are private. No gate reads them.
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @solar/web exec playwright install --with-deps chromium webkit
      - run: pnpm verify

  # The production image, built from the two years in fixtures/tiles, so that CI never calls JPL.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker buildx build --file deploy/Dockerfile --build-arg TILE_SOURCE=fixtures --load --tag learn-solar-system:ci .
      - run: |
          docker run --detach --name site --publish 127.0.0.1:8080:8080 learn-solar-system:ci
          curl --silent --output /dev/null --retry 20 --retry-delay 1 --retry-connrefused --retry-all-errors http://127.0.0.1:8080/healthz
      - run: deploy/check-image.sh http://127.0.0.1:8080
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @solar/web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @solar/web exec playwright test e2e/served.spec.ts
        env:
          E2E_BASE_URL: http://127.0.0.1:8080

  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: ~/.cache/solar-system/kernels
          key: kernels-${{ hashFiles('data/kernels.lock.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:kernel

  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: ~/.cache/solar-system/kernels
          key: kernels-${{ hashFiles('data/kernels.lock.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm obs:check
